apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: dashboard
          image: fridge-dashboard:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "backend.fridge.svc.cluster.local"
            - name: BACKEND_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fridge
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
