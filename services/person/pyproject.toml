[project]
name = "fridge-person"
version = "0.1.0"
description = "Fridge Tracker person service"
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "ensemble-boxes==1.0.10",
    "insightface==2.1",
    "jsonschema==4.26.0",
    "numpy==2.4.6",
    # Same 1.31.1 runtime everywhere: the CUDA 13 build on Linux (cloud/RTX GPUs; CPU fallback
    # without one), the CPU build elsewhere (Apple Silicon dev host).
    "onnxruntime==1.31.1; sys_platform != 'linux'",
    "onnxruntime-gpu[cuda,cudnn]==1.31.1; sys_platform == 'linux'",
    "opencv-python==5.0.0.93",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
]

[project.scripts]
fridge-person = "src.cli:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv]
# insightface requires the CPU `onnxruntime`; on Linux it would overwrite the GPU build's files.
override-dependencies = ["onnxruntime==1.31.1; sys_platform != 'linux'"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
