[project]
name = "fridge-person"
version = "0.1.0"
description = "Fridge Tracker person service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "ensemble-boxes==1.0.10",
    "insightface==2.1",
    "jsonschema==4.26.0",
    "numpy==2.4.6",
    "onnxruntime==1.31.1",
    "opencv-python==5.0.0.93",
    "scikit-learn==1.9.1",
]

[project.scripts]
fridge-person = "fridge_person:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
