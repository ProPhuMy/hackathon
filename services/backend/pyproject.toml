[project]
name = "fridge-backend"
version = "0.1.0"
description = "Fridge Tracker backend service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka>=2.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "mcp>=1.30.0,<2",
    "psycopg[binary]>=3.1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
fridge-backend = "fridge_backend:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
