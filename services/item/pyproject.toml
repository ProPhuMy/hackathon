[project]
name = "fridge-item"
version = "0.1.0"
description = "Fridge Tracker item service"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
fridge-item = "fridge_item:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
